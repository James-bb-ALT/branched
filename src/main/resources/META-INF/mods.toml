modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://example.invalid/branched/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Optional integrations. None of these are runtime requirements and none of
# them is Dynamic Trees: Dynamic Trees is a development-only reference.
[[dependencies.${mod_id}]]
    modId = "regions_unexplored"
    mandatory = false
    versionRange = "[0.5.6,1.0)"
    ordering = "AFTER"
    side = "BOTH"

